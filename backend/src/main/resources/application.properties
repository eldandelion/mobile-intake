server.port=8085
spring.application.name=mobile-intake-backend

# Load optional .env file from backend or root directory
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties],optional:file:./backend/.env[.properties],optional:file:../.env[.properties]

# Embedded SQLite Configuration
spring.datasource.url=jdbc:sqlite:intake.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# SQLite WAL mode initialization & busy timeout
spring.datasource.hikari.connection-init-sql=PRAGMA journal_mode=WAL; PRAGMA synchronous=NORMAL; PRAGMA busy_timeout=10000;
spring.datasource.hikari.maximum-pool-size=5

# Security & Secrets
intake.security.jwt-secret=medical-system-intake-secret-key-must-be-long-enough-32bytes
intake.security.admin-secret=csu-medical-intake-admin-secret-2026

# Alibaba Cloud SMS Gateway
aliyun.sms.enabled=${ALIYUN_SMS_ENABLED:false}
aliyun.sms.provider=${ALIBABA_SMS_PROVIDER:dysms}
aliyun.sms.access-key-id=${ALIBABA_SMS_ACCESS_KEY_ID:}
aliyun.sms.access-key-secret=${ALIBABA_SMS_ACCESS_KEY_SECRET:}
aliyun.sms.endpoint=${ALIBABA_SMS_ENDPOINT:dysmsapi.aliyuncs.com}
aliyun.sms.sign-name=${ALIBABA_SMS_SIGN_NAME:}
aliyun.sms.template-code=${ALIBABA_SMS_TEMPLATE_CODE:}
aliyun.sms.scheme-code=${ALIBABA_SMS_SCHEME_CODE:}


