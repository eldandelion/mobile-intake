server.port=8085
spring.application.name=mobile-intake-backend

# Embedded SQLite Configuration
spring.datasource.url=jdbc:sqlite:intake.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# SQLite WAL mode initialization & busy timeout
spring.datasource.hikari.connection-init-sql=PRAGMA journal_mode=WAL; PRAGMA synchronous=NORMAL; PRAGMA busy_timeout=10000;
spring.datasource.hikari.maximum-pool-size=5

# Security & Secrets
intake.security.jwt-secret=medical-system-intake-secret-key-must-be-long-enough-32bytes
intake.security.admin-secret=csu-medical-intake-admin-secret-2026
