# Isolated Test Database Configuration
spring.datasource.url=jdbc:sqlite:target/test-intake.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# SQLite WAL mode & Busy Timeout for tests
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA journal_mode=WAL; PRAGMA synchronous=NORMAL; PRAGMA busy_timeout=10000;

# Test Secrets
intake.security.jwt-secret=medical-system-intake-secret-key-must-be-long-enough-32bytes
intake.security.admin-secret=csu-medical-intake-admin-secret-2026
